name: ws-mask-pool-bench

'on':
  push:
    branches:
      - bench/ws-mask-pool
  workflow_dispatch:
    inputs:
      base:
        description: 'curl-fork commit without the change (test only)'
        default: 'd5e35fab68'
      head:
        description: 'curl-fork commit with the change'
        default: '9498a221d5'

permissions: {}

jobs:
  bench:
    name: ${{ matrix.os }} ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        compiler: [gcc, clang]
        exclude:
          # 'gcc' on macOS is Apple clang
          - os: macos-latest
            compiler: gcc
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: install
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev
            command -v "$COMPILER" >/dev/null ||
              sudo apt-get install -y "$COMPILER"
          else
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          fi
          echo "CC=$COMPILER" >> "$GITHUB_ENV"
      - name: run
        env:
          BASE: ${{ inputs.base || 'd5e35fab68' }}
          HEAD: ${{ inputs.head || '9498a221d5' }}
        run: |
          ./bench/run.sh | tee result.md
          cat result.md >> "$GITHUB_STEP_SUMMARY"
